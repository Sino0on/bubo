name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bubostore_test
          POSTGRES_USER: bubostore
          POSTGRES_PASSWORD: bubostore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bubostore -d bubostore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DEBUG: "False"
      SECRET_KEY: ci-test-secret-key-not-for-production-0123456789abcdefghijklmnop
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://bubostore:bubostore@localhost:5432/bubostore_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test

      - name: Django deployment checks
        run: python manage.py check --deploy --fail-level WARNING
