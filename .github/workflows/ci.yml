name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bubostore_test
          POSTGRES_USER: bubostore
          POSTGRES_PASSWORD: bubostore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bubostore -d bubostore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DEBUG: "False"
      SECRET_KEY: ci-test-secret-key-not-for-production-0123456789abcdefghijklmnop
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://bubostore:bubostore@localhost:5432/bubostore_test
      POSTGRES_DB: bubostore_test
      POSTGRES_USER: bubostore
      POSTGRES_PASSWORD: bubostore
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run migrations
        run: uv run python manage.py migrate --noinput

      - name: Run tests
        run: uv run python manage.py test

      - name: Django deployment checks
        run: uv run python manage.py check --deploy --fail-level WARNING
