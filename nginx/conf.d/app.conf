# Стартовый конфиг: только HTTP + ACME challenge для получения сертификата.
# После выпуска сертификата (см. DEPLOY.md) замените этот файл содержимым
# nginx/app-ssl.conf.example (с подставленным доменом) и перезапустите nginx.

server {
    listen 80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8032;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
